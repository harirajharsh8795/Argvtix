name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-and-test:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Strict type check with mypy
        run: |
          mypy src/argvtix --ignore-missing-imports

      - name: Run test suite with coverage
        run: |
          pytest tests/ -v --cov=src/argvtix --cov-report=xml --cov-report=term

      - name: Bench Gate (accuracy & taxonomy evaluation)
        run: |
          python bench/runner.py --split dev
          python bench/runner.py --split sealed

      - name: Verify README test count badge
        run: |
          python scripts/check_readme_badge.py

  postgres-rls-and-tenancy:
    name: PostgreSQL 16 Real RLS & Isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: argvtix_user
          POSTGRES_PASSWORD: argvtix_test_password
          POSTGRES_DB: argvtix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" psycopg2-binary

      - name: Run Alembic Migrations on Postgres
        env:
          ARGVTIX_DATABASE_URL: postgresql://argvtix_user:argvtix_test_password@localhost:5432/argvtix_test
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Run Postgres RLS and Tenancy Suite
        env:
          TEST_POSTGRES_URL: postgresql://argvtix_user:argvtix_test_password@localhost:5432/argvtix_test
        run: |
          pytest tests/test_postgres_rls.py tests/test_tenant_routing.py -v

  frontend-lint-and-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ui/package.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Lint frontend code
        working-directory: ui
        run: npm run lint

      - name: Build frontend production bundle
        working-directory: ui
        run: npm run build

  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Secret Scan (TruffleHog)
        uses: trufflesecurity/trufflehog@3.88.2
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -e .
          pip-audit --desc

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Docker container image
        run: |
          docker build -t argvtix:ci .
