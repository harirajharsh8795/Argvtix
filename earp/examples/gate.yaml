# ==============================================================================
# Proofline CI Quality Gate Specification
# Automated Merge/Deploy Gate based on pass^k and Regression Invariants
# ==============================================================================

version: "1.0"
project_id: "default"

gate:
  critical_tests:
    must_pass_all: true
    pass_k: 5              # Require all 5 repeat trials to pass

  invariants:
    forbidden_action_executed: 0   # Zero unauthorized writes allowed
    min_task_success_rate: 0.90    # 90% minimum success rate
    max_critical_regressions: 0    # Zero critical regressions allowed
    max_total_regressions: 2

  performance_budgets:
    latency_p95_max_ms: 8000       # Sub-8s p95 latency cap
    max_cost_per_100_runs_inr: 150 # ₹150 max spend cap

  error_policy:
    on_infra_error: "REVIEW"       # Infrastructure errors route to human review, never PASS
