[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argvtix"
version = "0.1.0"
description = "Enterprise AI Reliability Platform — Record, Guard, Evaluate, Watch your AI agents."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Harsh Rawat", email = "harirajharshrawat@gmail.com"},
]

dependencies = [
    # Core
    "pydantic>=2.7,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.30",
    # LLM & Agent
    "langchain>=0.3",
    "langgraph>=0.2",
    "litellm>=1.40",
    "google-generativeai>=0.8",
    # RAG
    "sentence-transformers>=3.0",
    "pgvector>=0.3",
    # Eval
    "ragas>=0.2",
    # Security
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    # Dashboard
    "streamlit>=1.38",
    "plotly>=5.22",
    # Data & Utils
    "faker>=28.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    "alembic",
    "ui",
    ".venv",
    ".hypothesis",
    ".pytest_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402", "B008", "SIM108", "UP042", "W291"]

[tool.ruff.lint.isort]
known-first-party = ["argvtix"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N806", "N802", "B018", "F841", "E402", "E712", "SIM117"]
"bench/*" = ["E402", "N806", "F841", "E712", "B023"]
"scripts/*" = ["E402", "N806", "F841", "E712"]

[tool.pytest.ini_options]
pythonpath = ["src", "sdk", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring database",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["no-untyped-def", "misc", "valid-type", "operator", "assignment", "arg-type", "attr-defined", "return-value", "no-any-return"]
disallow_untyped_defs = true
