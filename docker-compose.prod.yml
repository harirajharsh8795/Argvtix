version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL with pgvector extension & Healthcheck
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: argvtix-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-argvtix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be configured in production environment}
      POSTGRES_DB: ${POSTGRES_DB:-argvtix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argvtix} -d ${POSTGRES_DB:-argvtix}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    networks:
      - argvtix-net

  # ----------------------------------------------------------------------------
  # 2. Redis Shared Distributed Cache & Session Store
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: argvtix-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
    networks:
      argvtix-net:
        aliases:
          - redis
          - argvtix-redis

  # ----------------------------------------------------------------------------
  # 3. Database Migration Runner (Zero-Race Schema Synchronization)
  # ----------------------------------------------------------------------------
  migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: argvtix-migration
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-argvtix}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-argvtix}
    command: sh -c "python -m alembic upgrade head"
    networks:
      - argvtix-net

  # ----------------------------------------------------------------------------
  # 4. Scalable Backend API Cluster (Replicas: 3)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-argvtix}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-argvtix}
      REDIS_URL: redis://argvtix-redis:6379/0
      ARGVTIX_AUTH_ENABLED: ${ARGVTIX_AUTH_ENABLED:-true}
      ARGVTIX_JWT_SECRET: ${ARGVTIX_JWT_SECRET:?Error: ARGVTIX_JWT_SECRET must be configured in production environment}
      ARGVTIX_DAILY_LLM_CAP_USD: ${ARGVTIX_DAILY_LLM_CAP_USD:-50.0}
      ARGVTIX_MONTHLY_LLM_CAP_USD: ${ARGVTIX_MONTHLY_LLM_CAP_USD:-500.0}
      DB_POOL_SIZE: 15
      DB_MAX_OVERFLOW: 10
      DB_POOL_TIMEOUT: 30
      DB_POOL_RECYCLE: 1800
    stop_signal: SIGTERM
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      argvtix-net:
        aliases:
          - api
          - argvtix-api

  # ----------------------------------------------------------------------------
  # 5. Production Nginx Reverse Proxy & Load Balancer
  # ----------------------------------------------------------------------------
  ui:
    image: nginx:alpine
    container_name: argvtix-ui
    restart: always
    depends_on:
      - api
    volumes:
      - ./ui/dist:/usr/share/nginx/html:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "3000:80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - argvtix-net

  # ----------------------------------------------------------------------------
  # 6. Isolated Audit Sandbox
  # ----------------------------------------------------------------------------
  scout-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: argvtix-scout-sandbox
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      ARGVTIX_SCOUT_SANDBOX: "1"
    networks:
      - scout-isolated-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  argvtix-net:
    driver: bridge
  scout-isolated-net:
    driver: bridge
    internal: true
