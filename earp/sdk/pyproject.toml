[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofline-sdk"
version = "0.1.0"
description = "Proofline SDK: Zero-friction AI agent observability, guard enforcement, and trace instrumentation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Proofline Engineering", email = "engineering@proofline.ai" }]
dependencies = [
    "pydantic>=2.5.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "responses>=0.25.0",
]
