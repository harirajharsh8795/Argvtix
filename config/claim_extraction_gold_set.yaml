# Human-Labelled Claim Extraction Reference Dataset
# Strictly separate from the 30 planted cases in planted_cases.py.
# Used to measure precision, recall, and F1 score of the claim extractor.

cases:
  - id: "EXTRACT-001"
    domain: "ecommerce"
    language: "en"
    text: "Your refund of ₹1200 for order ORD-1042 has been successfully issued."
    expected_claims:
      - source_text: "Your refund of ₹1200 for order ORD-1042 has been successfully issued."
        claim_type: "refund_issued"
        entity_type: "order"
        entity_id: "ORD-1042"
        claimed_status: "completed"
        claimed_amount: 1200.0
        claimed_currency: "INR"
        is_success_claimed: true

  - id: "EXTRACT-002"
    domain: "ecommerce"
