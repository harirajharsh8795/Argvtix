version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: argvtix-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-argvtix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argvtix123}
      POSTGRES_DB: ${POSTGRES_DB:-argvtix}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argvtix -d argvtix"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: argvtix-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://argvtix:argvtix123@postgres:5432/argvtix
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8000:8000"
    command: uvicorn argvtix.gateway.app:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
